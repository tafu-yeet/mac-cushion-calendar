<!--
  Supabase > Authentication > Emails > Templates. Paste this into BOTH "Magic Link" and
  "Confirm signup". Subject for both: Your Mac Cushion Calendar code: {{ .Token }}
  The site asks for the 6-digit code; the button is for opening it on the same phone.
  /auth/confirm waits for a tap, because school email scanners open links on their own.
-->
<div style="background:#ffe3ea;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#7a1f3d">
  <div style="max-width:440px;margin:0 auto;background:#fff4e6;border-radius:24px;padding:28px">
    <p style="margin:0 0 4px;font-size:15px;font-weight:bold">Mac Cushion Calendar</p>
    <h1 style="margin:0 0 16px;font-size:22px">Your sign-in code</h1>
    <p style="margin:0 0 8px;font-size:15px;line-height:1.5">Type this code on the sign-in page:</p>
    <p style="margin:0 0 20px;font-size:34px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
    <p style="margin:0 0 20px;font-size:15px;line-height:1.5">Or, on this phone, tap the button:</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display:inline-block;background:#7a1f3d;color:#fff4e6;text-decoration:none;font-weight:bold;font-size:15px;padding:12px 22px;border-radius:999px">Sign in</a>
    <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#4f1229">The code works for an hour. Didn't ask for it? Ignore this email: nobody can sign in without the code.</p>
  </div>
</div>
